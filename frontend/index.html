<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨阁 · 写作素材台</title>
<style>
  /* ----------------------------------------------------------------
     配色：宣纸底 + 墨色字 + 赭石点缀，尽量素净，长时间看不累。

     布局是「一块式」的：
       整个屏幕 = 左导航 + 右舞台，两边各自独立，互不挤压。
       左导航固定宽度、不随内容滚动；
       右舞台是唯一的滚动容器，切换功能只是换它里面显示的那块。
     ---------------------------------------------------------------- */
  :root {
    --bg:      #f6f5f2;
    --card:    #ffffff;
    --line:    #e5e2dc;
    --line-2:  #f0eee9;
    --ink:     #26231f;
    --ink-2:   #6b665e;
    --ink-3:   #9c968c;
    --accent:  #8c5a3c;
    --accent-2:#f0e7e0;
    --danger:  #a8443a;
    --radius:  10px;
    --nav-w:   214px;   /* 左导航宽度，只在这里改一处 */
    --pad:     26px;    /* 右侧内容左右留白 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.65 "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;     /* 滚动交给右舞台，页面本身不动 */
  }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ==================== 整体骨架 ==================== */
  .app { display: flex; height: 100%; }

  /* ---------- 左：功能导航 ---------- */
  .nav {
    width: var(--nav-w); flex: 0 0 var(--nav-w);
    background: var(--card); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100%;
  }
  .navtop {
    display: flex; align-items: center; gap: 10px;
    padding: 17px 16px 14px;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; flex: 0 0 32px;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .brand { font-size: 15.5px; font-weight: 700; letter-spacing: 1.5px; }
  .brand small {
    display: block; font-weight: 400; font-size: 10.5px; letter-spacing: .5px;
    color: var(--ink-3); margin-top: 1px;
  }

  .navlist {
    flex: 1 1 auto; overflow: auto;
    padding: 4px 10px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .navitem {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 11px; border: none; border-radius: 9px;
    background: transparent; color: var(--ink-2); text-align: left;
    font-size: 13.5px; transition: background .14s, color .14s;
  }
  .navitem .ic { flex: 0 0 18px; height: 18px; color: var(--ink-3); }
  .navitem .ic svg { width: 18px; height: 18px; display: block; }
  .navitem .tx {
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .navitem:hover { background: var(--line-2); color: var(--ink); }
  .navitem:hover .ic { color: var(--ink-2); }
  .navitem.on { background: var(--ink); color: #fff; font-weight: 600; }
  .navitem.on .ic { color: #fff; }
  .badge {
    flex: 0 0 auto; font-size: 11px; color: var(--ink-3);
    background: var(--line-2); border-radius: 20px; padding: 0 7px;
  }
  .navitem.on .badge { background: rgba(255,255,255,.2); color: #fff; }
  .soon {
    flex: 0 0 auto; font-size: 10px; color: var(--ink-3);
    border: 1px dashed var(--line); border-radius: 20px; padding: 0 6px;
  }
  /* 选中项是深色底，虚线圈要跟着换成浅色，否则看不见 */
  .navitem.on .soon { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.4); }

  .navfoot { border-top: 1px solid var(--line); padding: 11px 14px; }
  .userbox { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 28px;
    background: var(--accent-2); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .uname {
    flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- 右：舞台 ---------- */
  .stage {
    flex: 1 1 auto; min-width: 0; height: 100%;
    overflow-y: auto; overflow-x: hidden;
  }
  .view { display: none; }
  .view.on { display: block; }

  /* 还没登录时，右侧内容区压暗、不可点 ——
     免得看起来像一个"能用的空页面"，让人以为网站坏了。
     顺带把左导航上的素材数徽标也藏起来（那时它只是个破折号）。 */
  body.guest .stage { opacity: .34; pointer-events: none; user-select: none; }
  body.guest .badge { visibility: hidden; }

  /* 功能头：功能名 + 该功能自己的操作 */
  .vhead {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 16px var(--pad) 12px;
    background: rgba(246,245,242,.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .vtitle {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .5px;
    flex: 0 0 auto;
  }
  /* 操作区吃掉整条剩余宽度、靠右对齐 —— 这样里面的搜索框和按钮
     永远排在一行，不会因为容器宽度算不准而折行。 */
  .vacts {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    flex: 1 1 auto; justify-content: flex-end;
  }

  .statsbar {
    display: flex; align-items: baseline; gap: 26px; flex-wrap: wrap;
    padding: 13px var(--pad) 0; font-size: 12.5px; color: var(--ink-3);
  }
  .statsbar .num {
    font-size: 17px; font-weight: 600; color: var(--ink); margin-right: 5px;
  }

  .vbody {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 16px var(--pad) 60px;
  }

  /* ==================== 素材库：标签栏 + 列表 ==================== */
  .tagside { width: 178px; flex: 0 0 178px; position: sticky; top: 124px; }
  .tagside h3 {
    margin: 0 0 8px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; color: var(--ink-3);
  }
  .taglist { display: flex; flex-direction: column; gap: 2px; max-height: 64vh; overflow: auto; }
  .tag {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 10px; border-radius: 8px; border: none; background: transparent;
    color: var(--ink-2); text-align: left; width: 100%;
  }
  .tag:hover { background: var(--line-2); }
  .tag.on { background: var(--ink); color: #fff; }
  .tag i {
    font-style: normal; font-size: 11px; color: var(--ink-3);
    background: var(--line-2); border-radius: 20px; padding: 0 7px;
  }
  .tag.on i { background: rgba(255,255,255,.22); color: #fff; }
  .side .empty-tip, .tagside .empty-tip { font-size: 12px; color: var(--ink-3); padding: 4px 10px; }

  .listwrap { flex: 1 1 auto; min-width: 0; }
  .listhead {
    display: flex; align-items: center; gap: 10px; min-height: 20px;
    font-size: 12px; color: var(--ink-3); margin-bottom: 8px;
  }
  .listhead .clr { color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* ==================== 未开放功能的占位页 ==================== */
  .soonwrap {
    max-width: 520px; margin: 92px auto 0; text-align: center;
    padding: 0 var(--pad);
  }
  .soonic {
    width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-3);
    display: flex; align-items: center; justify-content: center;
  }
  .soonic svg { width: 28px; height: 28px; }
  .soonwrap h2 { margin: 0 0 8px; font-size: 19px; letter-spacing: .5px; }
  .soonwrap p { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }
  .soonnote {
    font-size: 12.5px; color: var(--ink-3); line-height: 1.9;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px; text-align: left;
  }
  .soonnote b { color: var(--ink-2); }

  /* ==================== 通用控件 ==================== */
  .search {
    flex: 1 1 150px; min-width: 150px; max-width: 320px;
    height: 36px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fbfaf8; outline: none;
  }
  .search:focus { border-color: var(--accent); background: #fff; }
  .btn {
    height: 36px; padding: 0 15px; border-radius: var(--radius);
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: #3d3833; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ==================== 素材卡片 ==================== */
  .card {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 16px; margin-bottom: 9px;
    transition: .15s;
  }
  .card:hover { border-color: #d5d0c8; box-shadow: 0 1px 6px rgba(0,0,0,.04); }
  .card .body { flex: 1 1 auto; min-width: 0; }
  .card .title {
    font-weight: 600; cursor: pointer; word-break: break-all;
    display: inline-block;
  }
  .card .title:hover { color: var(--accent); text-decoration: underline; }
  .card .meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-3); margin-top: 3px;
  }
  .card .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    font-size: 11px; color: var(--accent);
    background: var(--accent-2); border-radius: 20px; padding: 1px 9px;
  }
  .chip.local { color: #7a6a2a; background: #f4efdc; }
  .chip.warn { color: #8a4a2c; background: #fbeade; }
  .card .acts { display: flex; gap: 6px; flex: 0 0 auto; }
  .mini {
    font-size: 12px; padding: 3px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  }
  .mini:hover { border-color: var(--ink-3); color: var(--ink); }
  .mini.d { color: var(--danger); border-color: #ecdcda; }
  .mini.d:hover { background: #fdf4f3; }

  .blank {
    text-align: center; color: var(--ink-3);
    padding: 70px 20px; background: var(--card);
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .blank b { display: block; font-size: 15px; color: var(--ink-2); margin-bottom: 6px; }

  /* ==================== 弹窗 ==================== */
  .mask {
    position: fixed; inset: 0; background: rgba(38,35,31,.34);
    display: none; align-items: center; justify-content: center;
    z-index: 60; padding: 24px;
  }
  .mask.on { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 100%;
    max-width: 620px; max-height: 86vh; display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .modal.wide { max-width: 860px; }
  .modal header {
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .modal header h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal header .x {
    margin-left: auto; border: none; background: none;
    font-size: 20px; line-height: 1; color: var(--ink-3); padding: 0 4px;
  }
  .modal header .x:hover { color: var(--ink); }
  .modal .content { padding: 18px 20px; overflow: auto; }
  .modal footer {
    padding: 13px 20px; border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
  }
  .modal footer .grow { flex: 1 1 auto; }
  .field { margin-bottom: 13px; }
  .field label {
    display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px;
  }
  .field .hint { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.6; }
  .field input[type=text], .field input[type=password], .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: #fbfaf8; outline: none; resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); background: #fff; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }

  /* ---------- 登录 / 注册 ---------- */
  .mask.auth { z-index: 90; background: rgba(38,35,31,.5); }
  .modal.login { max-width: 400px; }
  .modal.login header { padding: 24px 26px 18px; border-bottom: none; }
  .modal.login header h2 { font-size: 20px; letter-spacing: 2px; }
  .modal.login header p {
    margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); font-weight: 400;
  }
  .modal.login .content { padding: 4px 26px 8px; }
  .modal.login footer { padding: 16px 26px 22px; border-top: none; }
  .authnote {
    font-size: 11.5px; color: var(--ink-3); line-height: 1.7;
    background: #fbfaf8; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; margin-top: 2px;
  }
  .authmsg {
    font-size: 12.5px; color: var(--danger); min-height: 18px; padding-top: 2px;
    line-height: 1.5;
  }
  .tabsw {
    display: flex; gap: 3px; background: var(--line-2); border-radius: 9px;
    padding: 3px; margin-bottom: 16px;
  }
  .tabsw button {
    flex: 1 1 0; border: none; background: transparent; color: var(--ink-2);
    padding: 7px 0; border-radius: 7px; font-size: 13px;
  }
  .tabsw button.on { background: #fff; color: var(--ink); font-weight: 600;
                     box-shadow: 0 1px 3px rgba(0,0,0,.07); }

  /* ---------- 预览表（导入 / 上传共用） ---------- */
  .preview { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .preview .row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; border-bottom: 1px solid var(--line-2); font-size: 13px;
  }
  .preview .row:last-child { border-bottom: none; }
  .preview .row .st {
    flex: 0 0 40px; font-size: 11px; text-align: center;
    border-radius: 5px; padding: 1px 0;
  }
  .st.new { background: #e8f1e9; color: #3b6b45; }
  .st.same { background: var(--line-2); color: var(--ink-3); }
  .st.empty { background: #f6f1e2; color: #8a7330; }
  .st.fail { background: #fbeceb; color: var(--danger); }
  .preview .row .nm { flex: 1 1 auto; min-width: 0; word-break: break-all; }
  .preview .row .ch { flex: 0 0 auto; color: var(--ink-3); font-size: 12px; }
  .preview .row .tg { flex: 0 0 auto; color: var(--accent); font-size: 11px; }
  .sumline {
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px;
    color: var(--ink-2); margin: 12px 0 10px;
  }
  .sumline b { font-weight: 600; }

  /* ---------- 拖放区 ---------- */
  .drop {
    border: 2px dashed var(--line); border-radius: 12px;
    padding: 34px 20px; text-align: center; color: var(--ink-2);
    background: #fbfaf8; transition: .15s; margin-bottom: 4px; cursor: pointer;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); background: var(--accent-2); color: var(--accent);
  }
  .drop b { display: block; font-size: 15px; margin-bottom: 5px; }
  .drop span { font-size: 12px; color: var(--ink-3); }
  .drop em { font-style: normal; color: var(--accent); }

  /* ---------- 详情抽屉 ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 92vw);
    background: var(--card); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .22s ease, visibility .22s;
    z-index: 70; display: flex; flex-direction: column;
    box-shadow: -8px 0 34px rgba(0,0,0,.1);
    /* visibility:hidden 不是多余的一笔：
       translateX(100%) 只是把它"挪"到屏幕外，它仍然存在于页面上，
       窄窗口或某些渲染环境下会漏出来一条边，屏幕阅读器也还会读到里面的内容。
       关着的时候干脆整个不可见、不可点，更干净。 */
    visibility: hidden; pointer-events: none;
  }
  .drawer.on { transform: none; visibility: visible; pointer-events: auto; }
  .drawer header {
    padding: 15px 60px 15px 22px; border-bottom: 1px solid var(--line);
    position: relative;
  }
  .drawer header .t { font-size: 15px; font-weight: 600; word-break: break-all; }
  .drawer header .m { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .drawer header .x {
    position: absolute; top: 12px; right: 16px; border: none; background: none;
    font-size: 22px; line-height: 1; color: var(--ink-3);
  }
  .drawer header .x:hover { color: var(--ink); }
  .drawer .edits {
    padding: 12px 22px; border-bottom: 1px solid var(--line); background: #fbfaf8;
  }
  .drawer .edits .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .drawer .edits .row:last-child { margin-bottom: 0; }
  .drawer .edits label { flex: 0 0 46px; font-size: 12px; color: var(--ink-2); }
  .drawer .edits input[type=text] {
    flex: 1 1 auto; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; outline: none;
  }
  .drawer .text {
    flex: 1 1 auto; overflow: auto; padding: 18px 22px 40px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.9;
  }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(12px);
    background: #33302c; color: #fff; padding: 10px 18px; border-radius: 9px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 99;
    max-width: 80vw;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: var(--danger); }

  /* ==================== 窄屏：左导航收成图标条 ==================== */
  @media (max-width: 900px) {
    :root { --nav-w: 62px; --pad: 16px; }
    .navtop { justify-content: center; padding: 14px 0 12px; }
    .brand { display: none; }
    .navlist { padding: 4px 8px 12px; }
    .navitem { justify-content: center; padding: 10px 0; }
    .navitem .tx, .badge, .soon { display: none; }
    .navfoot { padding: 11px 8px; }
    .userbox { flex-direction: column; gap: 7px; }
    .uname { display: none; }
    .vbody { flex-direction: column; }
    .tagside { width: 100%; flex: none; position: static; }
    .taglist { flex-direction: row; flex-wrap: wrap; }
    .tag { width: auto; }
    .vacts { margin-left: 0; width: 100%; }
    .search { flex: 1 1 100%; max-width: none; }
  }
  @media (max-width: 560px) {
    .vacts .btn { flex: 1 1 auto; }
  }
</style>
</head>
<body class="guest">

<div class="app">

  <!-- ==================== 左：功能导航 ====================
       这一列的内容不写死，由下面 JS 里的 VIEWS 清单渲染出来。
       以后加功能 = 往 VIEWS 里加一行。 -->
  <aside class="nav">
    <div class="navtop">
      <div class="logo">墨</div>
      <div class="brand">墨阁<small>写作素材台</small></div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="navfoot">
      <div class="userbox" id="userbox" hidden>
        <div class="avatar" id="uAvatar">墨</div>
        <span class="uname" id="uname"></span>
        <button class="mini" id="btnLogout">退出</button>
      </div>
    </div>
  </aside>

  <!-- ==================== 右：功能舞台 ==================== -->
  <main class="stage">

    <!-- ---------- 功能一：总素材库 ---------- -->
    <section class="view on" id="view-library">
      <header class="vhead">
        <h1 class="vtitle">总素材库</h1>
        <div class="vacts">
          <input id="search" class="search" type="text" placeholder="搜索标题或正文里的词…">
          <button class="btn primary" id="btnUpload">上传文件</button>
          <button class="btn" id="btnImport">导入文件夹</button>
          <button class="btn" id="btnPaste">粘贴文本</button>
        </div>
      </header>

      <div class="statsbar">
        <div><span class="num" id="sMat">-</span>份素材</div>
        <div><span class="num" id="sChar">-</span>字</div>
        <div><span class="num" id="sTag">-</span>个标签</div>
      </div>

      <div class="vbody">
        <aside class="tagside">
          <h3>标签</h3>
          <div class="taglist" id="tagbar"></div>
        </aside>
        <div class="listwrap">

<script>
/* ==================================================================
   前端逻辑
   一句话概括：从后端 API 取数据 → 渲染成 HTML → 用户点了什么 → 再调 API

   状态分两块：
     S  跟"看素材"有关（搜索词、当前标签、当前打开的那条、当前在哪个功能）
     A  跟"账号"有关（登录模式、当前用户、是不是首次使用、有没有未归属素材）
   ================================================================== */

/* ---------------- 功能清单 ----------------
   左侧栏就是这张表渲染出来的。加功能 = 往这里加一行，其余不用动。
     id     功能的唯一标识，也是右侧页面 id 的后缀（view-<id>）
     name   左侧栏显示的名字
     icon   图标名，对应下面 ICONS 里的某个键
     ready  做完了吗？没做完的显示"待做"，点进去是占位页
     desc   一句话说明它是干什么的
------------------------------------------------------------------ */
const VIEWS = [
  { id: "library",  name: "总素材库", icon: "library", ready: true,
    desc: "所有素材都在这里" },
  { id: "search",   name: "素材检索", icon: "search",  ready: false,
    desc: "按关键词从素材库里捞出最相关的片段，为写稿做准备" },
  { id: "classify", name: "素材分类", icon: "tag",     ready: false,
    desc: "给素材分门别类，支持批量改标签、合并同类项" },
  { id: "infuse",   name: "剧情内化", icon: "wand",    ready: false,
    desc: "把原始素材提炼成可复用的剧情零件（谁做了什么、动机是什么）" },
  { id: "outline",  name: "大纲生成", icon: "list",    ready: false,
    desc: "从剧情库里挑零件，拼出一篇能直接动笔的细纲" },
  { id: "persona",  name: "人设卡",   icon: "user",    ready: false,
    desc: "角色的性格、关系、说话方式，写对话时随时对照" }
];

/* 线性图标，统一 24×24、线条描边。加功能时在 VIEWS 里引用的名字要在这里有 */
const ICONS = {
  library: '<path d="M12 6.6C10.6 5.4 8.7 5 6.6 5H4v13h2.6c2.1 0 4 .4 5.4 1.6"/>' +
           '<path d="M12 6.6C13.4 5.4 15.3 5 17.4 5H20v13h-2.6c-2.1 0-4 .4-5.4 1.6"/>' +
           '<path d="M12 6.6v13"/>',
  search: '<circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8L20 20"/>',
  tag: '<path d="M11.4 3.6H18a2.4 2.4 0 0 1 2.4 2.4v6.6a2.4 2.4 0 0 1-.7 1.7' +
       'l-6.3 6.3a2.4 2.4 0 0 1-3.4 0l-5.1-5.1a2.4 2.4 0 0 1 0-3.4l6.3-6.3' +
       'a2.4 2.4 0 0 1 1.7-.7z"/><circle cx="15.6" cy="8.4" r="1.3"/>',
  wand: '<path d="M4.6 19.4l9.6-9.6"/>' +
        '<path d="M15.8 3.4l1.1 2.5 2.5 1.1-2.5 1.1-1.1 2.5-1.1-2.5-2.5-1.1 2.5-1.1z"/>' +
        '<path d="M19.6 12.6l.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7z"/>',
  list: '<path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11"/>' +
        '<circle cx="4.4" cy="6.5" r="1.05"/><circle cx="4.4" cy="12" r="1.05"/>' +
        '<circle cx="4.4" cy="17.5" r="1.05"/>',
  user: '<circle cx="12" cy="8.4" r="3.5"/><path d="M5.2 19.6c0-3.5 3-6 6.8-6s6.8 2.5 6.8 6"/>'
};

function svgIcon(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
         (ICONS[name] || ICONS.list) + '</svg>';
}

const S = { view: "library", keyword: "", tag: "", current: null };
const A = { mode: "login", user: null, firstTime: false, unclaimed: 0, busy: false };

/* 把用户内容里的尖括号转义，避免素材正文里的 < > 破坏页面结构 */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, 2600);
}

/* 统一封装 fetch：出错就抛，调用处只管 catch

   里面那段 401 的处理是整个前端"最省事"的一处设计：
   登录过期后，任何一个请求都会走到这里，自动弹回登录页。
   于是每个具体的功能（列表、导入、上传、删除…）都不用自己写
   "如果没登录该怎么办"。这叫把重复逻辑收到一个地方。 */
async function api(url, opt) {
  const r = await fetch(url, opt);
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }

  if (r.status === 401) {
    // 登录接口自己返回 401 是"密码不对"，不该再弹一次登录框
    if (url.indexOf("/api/auth/") !== 0) showAuth("登录已过期，请重新登录");
    const d = (data && data.detail) || "还没登录";
    throw new Error(typeof d === "string" ? d : "还没登录");
  }
  if (!r.ok) {
    const msg = (data && (data.detail || data.message)) || ("请求失败 " + r.status);
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}

function post(url, body) {
  return api(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
}

function fmtNum(n) {
  return (n || 0).toLocaleString("zh-CN");
}

/* ================== 左导航与功能切换 ================== */

/* 按 VIEWS 画出左侧那一列 */
function renderNav() {
  const box = document.getElementById("navlist");
  box.innerHTML = VIEWS.map(v => {
    const cls = "navitem" + (v.id === S.view ? " on" : "") + (v.ready ? "" : " off");
    const right = v.ready
      ? '<span class="badge" id="navCount">-</span>'
      : '<span class="soon">待做</span>';
    return '<button class="' + cls + '" data-view="' + v.id + '" ' +
             'title="' + esc(v.name) + '">' +
             '<span class="ic">' + svgIcon(v.icon) + '</span>' +
             '<span class="tx">' + esc(v.name) + '</span>' + right +
           '</button>';
  }).join("");

  box.querySelectorAll(".navitem").forEach(el => {
    el.onclick = () => goView(el.dataset.view);
  });
}

/* 切到某个功能 */
function goView(id) {
  const v = VIEWS.find(x => x.id === id);
  if (!v) return;

  S.view = id;
  document.querySelectorAll(".navitem").forEach(el => {
    el.classList.toggle("on", el.dataset.view === id);
  });

  // 做完了的功能有自己的页面；没做完的统一进占位页
  const target = v.ready ? id : "soon";
  document.querySelectorAll(".view").forEach(el => {
    el.classList.toggle("on", el.id === "view-" + target);
  });

  if (!v.ready) {
    document.getElementById("soonIcon").innerHTML = svgIcon(v.icon);
    document.getElementById("soonName").textContent = v.name;
    document.getElementById("soonDesc").textContent = v.desc;
    const order = VIEWS.filter(x => !x.ready).map(x => x.name).join(" → ");
    document.getElementById("soonNote").innerHTML =
      '这个功能还没动手做。<b>左侧栏从上到下的顺序，就是开发顺序</b>，' +
      '做完一个点亮一个。<br><br>' +
      '排在它前面的还有：' + esc(order);
  }

  document.querySelector(".stage").scrollTop = 0;
}

/* 解析时留下的提示信息，只在列表里露出真正需要注意的那几条。
   「段落 42 个」这类细节放详情里看，列表上堆着是噪音。 */
function warnOf(note) {
  if (!note) return "";
  if (note.indexOf("扫描件") >= 0) return "图片版·无文字";
  if (note.indexOf("未提取") >= 0) return "含图片未提取";
  return "";
}

/* ================== 登录 / 注册 ================== */

function setUser(u) {
  A.user = u;
  const box = document.getElementById("userbox");
  if (u) {
    box.hidden = false;
    document.getElementById("uname").textContent = u.username;
    document.getElementById("uAvatar").textContent = u.username.slice(0, 1);
  } else {
    box.hidden = true;
  }
}

function setAuthMode(mode) {
  A.mode = mode;
  document.querySelectorAll("#authTabs button").forEach(b => {
    b.classList.toggle("on", b.dataset.mode === mode);
  });
  const isReg = mode === "register";
  document.getElementById("authTitle").textContent = isReg ? "创建账号" : "登录墨阁";
  document.getElementById("aSubmit").textContent = isReg ? "注册并进入" : "登录";
  document.getElementById("aPwd").setAttribute(
    "autocomplete", isReg ? "new-password" : "current-password");

  /* "接收之前导入的素材"这个选项只在注册时出现，而且真的有东西可接才出现。
     素材是早期用命令行导入的，那会儿还没有账号，所以它们暂时没有归属。 */
  const wrap = document.getElementById("aAdoptWrap");
  if (isReg && A.unclaimed > 0) {
    wrap.hidden = false;
    document.getElementById("aAdoptText").textContent =
      "把之前导入的 " + A.unclaimed + " 条素材转到这个账号名下（不勾就仍留在未分配状态）";
  } else {
    wrap.hidden = true;
  }

  document.getElementById("aNote").innerHTML = isReg
    ? "账号只存在你自己电脑上的数据库里（data/moge.db），不会上传到任何地方。<br>" +
      "用户名 2–20 个字符，可用中文；密码至少 6 位。"
    : "素材是分账号存放的，每个账号只能看到自己的东西。";
  aMsg("");
}

function aMsg(text) {
  document.getElementById("aMsg").textContent = text || "";
}

function showAuth(reason) {
  document.body.classList.add("guest");
  document.getElementById("mkAuth").classList.add("on");
  if (reason) aMsg(reason);
  setAuthMode(A.firstTime ? "register" : A.mode);
  setTimeout(() => {
    const el = document.getElementById("aName");
    if (el) el.focus();
  }, 80);
}

function hideAuth() {
  document.body.classList.remove("guest");
  document.getElementById("mkAuth").classList.remove("on");
  aMsg("");
  document.getElementById("aPwd").value = "";
}

async function submitAuth() {
  if (A.busy) return;
  const name = document.getElementById("aName").value.trim();
  const pwd = document.getElementById("aPwd").value;
  const isReg = A.mode === "register";

  if (!name) { aMsg("请填写用户名"); return; }
  if (!pwd) { aMsg("请填写密码"); return; }

  A.busy = true;
  const btn = document.getElementById("aSubmit");
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = isReg ? "注册中…" : "登录中…";
  aMsg("");
  try {
    const body = { username: name, password: pwd };
    if (isReg) {
      const wrap = document.getElementById("aAdoptWrap");
      body.adopt_mine = !wrap.hidden &&
                        document.getElementById("aAdopt").checked;
    }
    const r = await post(isReg ? "/api/auth/register" : "/api/auth/login", body);
    setUser(r.user);
    hideAuth();
    document.getElementById("aName").value = "";
    document.getElementById("aPwd").value = "";

    if (isReg && r.adopted > 0) {
      toast("账号已创建，并接收了之前导入的 " + r.adopted + " 条素材");
    } else {
      toast(isReg ? "账号已创建，欢迎使用墨阁" : "欢迎回来，" + r.user.username);
    }
    startApp();
  } catch (e) {
    aMsg(e.message);
  } finally {
    A.busy = false;
    btn.disabled = false; btn.textContent = old;
  }
}

async function doLogout() {
  if (!confirm("确定退出登录？素材不会丢，重新登录就能看到。")) return;
  try { await post("/api/auth/logout"); } catch (e) { /* 退出失败也照样清前台 */ }
  setUser(null);
  S.keyword = ""; S.tag = ""; S.view = "library";
  document.getElementById("search").value = "";
  document.getElementById("list").innerHTML = "";
  document.getElementById("tagbar").innerHTML = "";
  document.getElementById("listhead").innerHTML = "";
  ["sMat", "sChar", "sTag"].forEach(id => document.getElementById(id).textContent = "-");
  const nb = document.getElementById("navCount");
  if (nb) nb.textContent = "-";
  goView("library");
  A.firstTime = false;
  setAuthMode("login");
  showAuth("已退出登录");
}

async function boot() {
  renderNav();
  goView("library");

  // 先问服务几件事：有人注册过吗？有没有还没归属的素材？我现在是谁？
  try {
    const h = await api("/api/health");
    A.firstTime = (h.users || 0) === 0;
    A.unclaimed = h.unclaimed || 0;
  } catch (e) {
    aMsg("连不上后端服务：" + e.message);
  }
  try {
    const me = await api("/api/auth/me");
    if (me.logged_in) {
      setUser(me.user);
      hideAuth();
      startApp();
      return;
    }
  } catch (e) { /* 未登录会走到这里，正常 */ }

  if (A.firstTime) {
    setAuthMode("register");
    document.getElementById("authSub").textContent = "第一次使用，先给自己建一个账号";
    aMsg("");
  } else {
    setAuthMode("login");
    showAuth("");
  }
}

/* ---------------- 读取与渲染 ---------------- */

async function loadStats() {
  try {
    const s = await api("/api/stats");
    document.getElementById("sMat").textContent = fmtNum(s.materials);
    document.getElementById("sChar").textContent = fmtNum(s.chars);
    document.getElementById("sTag").textContent = fmtNum(s.tags);
    // 左侧栏「总素材库」后面那个数字，跟统计是同一个来源
    const nb = document.getElementById("navCount");
    if (nb) nb.textContent = fmtNum(s.materials);
  } catch (e) { /* 统计失败不打断主流程 */ }
}

async function loadTags() {
  const box = document.getElementById("tagbar");
  let items = [], total = 0;
  try {
    const r = await api("/api/tags");
    items = r.items;
    total = r.total_materials;
  } catch (e) { }

  let html = '<button class="tag' + (S.tag === "" ? " on" : "") +
             '" data-tag="">全部 <i>' + total + '</i></button>';
  for (const t of items) {
    html += '<button class="tag' + (S.tag === t.name ? " on" : "") +
            '" data-tag="' + esc(t.name) + '">' + esc(t.name) +
            ' <i>' + t.count + '</i></button>';
  }
  if (!items.length) {
    html += '<div class="empty-tip">还没有标签，导入素材后会自动生成。</div>';
  }
  box.innerHTML = html;

  box.querySelectorAll(".tag").forEach(el => {
    el.onclick = () => { S.tag = el.dataset.tag; loadTags(); loadList(); };
  });
}

async function loadList() {
  const box = document.getElementById("list");
  const head = document.getElementById("listhead");
  box.innerHTML = '<div class="blank">读取中…</div>';

  let data;
  try {
    const q = new URLSearchParams({ keyword: S.keyword, tag: S.tag, limit: "200" });
    data = await api("/api/materials?" + q.toString());
  } catch (e) {
    box.innerHTML = '<div class="blank"><b>读取失败</b>' + esc(e.message) + '</div>';
    return;
  }

  const bits = ["共 " + data.total + " 条"];
  if (S.keyword) bits.push('搜索「' + esc(S.keyword) + '」');
  if (S.tag) bits.push('标签「' + esc(S.tag) + '」');
  head.innerHTML = bits.join(" · ") +
    ((S.keyword || S.tag) ? ' <span class="clr" id="clrFilter">清除筛选</span>' : "");
  const clr = document.getElementById("clrFilter");
  if (clr) clr.onclick = () => { S.keyword = ""; S.tag = "";
                                 document.getElementById("search").value = "";
                                 loadTags(); loadList(); };

  if (!data.items.length) {
    box.innerHTML = '<div class="blank"><b>这里还没有素材</b>' +
      '点右上角的「上传文件」，把你的 txt / docx 拖进来试试。</div>';
    maybeOfferAdopt();
    return;
  }

  box.innerHTML = data.items.map(m => {
    const tags = m.tags.map(t => '<span class="chip">' + esc(t) + '</span>').join("");
    const local = m.local_only ? '<span class="chip local">仅本地</span>' : "";
    const warn = warnOf(m.note);
    const warnChip = warn ? '<span class="chip warn">' + esc(warn) + '</span>' : "";
    const src = m.source_path ? esc(m.source_path.split("\\").pop()) : "";
    return '<div class="card">' +
      '<div class="body">' +
        '<span class="title" data-id="' + m.id + '">' + esc(m.title) + '</span>' +
        '<div class="meta">' +
          '<span>' + fmtNum(m.chars) + ' 字</span>' +
          '<span>' + esc(m.ext || "") + '</span>' +
          (src ? '<span>' + src + '</span>' : '') +
          '<span>' + esc(m.created_at) + '</span>' +
        '</div>' +
        ((tags || local || warnChip)
          ? '<div class="tags">' + tags + warnChip + local + '</div>' : '') +
      '</div>' +
      '<div class="acts">' +
        '<button class="mini" data-open="' + m.id + '">查看</button>' +
        '<button class="mini d" data-del="' + m.id + '">删除</button>' +
      '</div>' +
    '</div>';
  }).join("");

  box.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openDrawer(+el.dataset.open);
  });
  box.querySelectorAll(".title").forEach(el => {
    el.onclick = () => openDrawer(+el.dataset.id);
  });
  box.querySelectorAll("[data-del]").forEach(el => {
    el.onclick = () => removeMaterial(+el.dataset.del, el);
  });
}

/* 素材库空着、但库里还有"没归属的素材"时，给一个一键接收的入口。
   这些素材是你早期用命令行导入的，注册账号时如果没勾选"接收"，就会留在这儿。 */
async function maybeOfferAdopt() {
  try {
    const h = await api("/api/health");
    if (!h.unclaimed) return;
    const blank = document.querySelector("#list .blank");
    if (!blank) return;

    const wrap = document.createElement("div");
    wrap.style.marginTop = "14px";
    const btn = document.createElement("button");
    btn.className = "mini";
    btn.textContent = "接收之前导入的 " + h.unclaimed + " 条素材";
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const r = await post("/api/auth/adopt");
        toast(r.message);
        A.unclaimed = 0;
        loadStats(); loadTags(); loadList();
      } catch (e) { toast(e.message, true); btn.disabled = false; }
    };
    wrap.appendChild(btn);
    blank.appendChild(wrap);
  } catch (e) { /* 拿不到就算了，不影响主流程 */ }
}

/* ---------------- 详情抽屉 ---------------- */

async function openDrawer(id) {
  try {
    const m = await api("/api/materials/" + id);
    S.current = m;
    document.getElementById("dTitle").textContent = m.title;
    document.getElementById("dMeta").textContent =
      fmtNum(m.chars) + " 字 · " + (m.ext || "") + " · 存于 " + m.created_at +
      (m.note ? " · " + m.note : "");
    document.getElementById("dEditTitle").value = m.title;
    document.getElementById("dEditTags").value = m.tags.join("，");
    document.getElementById("dLocal").checked = !!m.local_only;
    document.getElementById("dText").textContent = m.content;
    document.getElementById("drawer").classList.add("on");
    document.getElementById("mkDrawer").classList.add("on");
  } catch (e) { toast(e.message, true); }
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("mkDrawer").classList.remove("on");
  S.current = null;
}

async function saveDrawer() {
  if (!S.current) return;
  const tags = document.getElementById("dEditTags").value
    .split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  try {
    await api("/api/materials/" + S.current.id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: document.getElementById("dEditTitle").value.trim(),
        tags: tags,
        local_only: document.getElementById("dLocal").checked
      })
    });
    toast("已保存");
    closeDrawer();
    loadStats(); loadTags(); loadList();
  } catch (e) { toast(e.message, true); }
}

function removeMaterial(id, el) {
  const name = el.closest(".card")?.querySelector(".title")?.textContent || "这条素材";
  if (!confirm('确定删除「' + name + '」？\n\n这个动作不可撤销。')) return;
  api("/api/materials/" + id, { method: "DELETE" })
    .then(() => { toast("已删除"); loadStats(); loadTags(); loadList(); })
    .catch(e => toast(e.message, true));
}

/* ---------------- 弹窗开关 ---------------- */

function openMask(id) { document.getElementById(id).classList.add("on"); }
function closeMask(id) { document.getElementById(id).classList.remove("on"); }

/* ---------------- 结果预览（导入文件夹与上传共用一套渲染） ---------------- */

function previewHtml(res) {
  const s = res.summary;
  const sum = '<div class="sumline">' +
    '<span>共 <b>' + s.total + '</b> 个文件</span>' +
    '<span>新入库 <b>' + s.new + '</b></span>' +
    '<span>已在库里 <b>' + s.same + '</b></span>' +
    '<span>无文字 <b>' + s.empty + '</b></span>' +
    '<span>读不出 <b>' + s.fail + '</b></span>' +
    '<span>合计 <b>' + fmtNum(s.chars) + '</b> 字</span>' +
    '</div>';

  const rows = res.items.map(it => {
    const label = { new: "新", same: "重复", empty: "空", fail: "失败" }[it.status];
    const tg = (it.tags || []).length ? it.tags.join("、") : "";
    const tip = (it.status === "empty" || it.status === "fail") ? it.message : "";
    return '<div class="row">' +
      '<span class="st ' + it.status + '">' + label + '</span>' +
      '<span class="nm">' + esc(it.name) +
        (tip ? '<br><span style="font-size:11.5px;color:var(--ink-3)">' + esc(tip) + '</span>' : '') +
      '</span>' +
      '<span class="tg">' + esc(tg) + '</span>' +
      '<span class="ch">' + fmtNum(it.chars) + ' 字</span>' +
    '</div>';
  }).join("");

  return sum + '<div class="preview">' + rows + '</div>';
}

/* ---------------- 上传文件 ---------------- */

async function uploadFiles(files) {
  if (!files || !files.length) return;
  openMask("mkUpload");

  const list = Array.from(files);
  document.getElementById("upMsg").textContent =
    "正在解析 " + list.length + " 个文件…";
  const box = document.getElementById("upPreview");
  box.innerHTML = '<div class="sumline">解析中，请稍候…</div>';

  const fd = new FormData();
  list.forEach(f => fd.append("files", f));

  try {
    const res = await api("/api/upload", { method: "POST", body: fd });
    box.innerHTML = previewHtml(res);
    const s = res.summary;
    document.getElementById("upMsg").textContent =
      "新增 " + s.new + " 条，重复 " + s.same + " 条" +
      (s.fail + s.empty ? "，未成功 " + (s.fail + s.empty) + " 条" : "");
    if (s.new) toast("已入库 " + s.new + " 条素材");
    else if (s.same) toast("这些内容库里都有了，没有重复存");
    else toast("没有能入库的内容", true);
    loadStats(); loadTags(); loadList();
  } catch (e) {
    box.innerHTML = "";
    document.getElementById("upMsg").textContent = e.message;
    toast(e.message, true);
  }
}

/* ---------------- 导入文件夹 ---------------- */

function resetImportPreview() {
  document.getElementById("impPreview").innerHTML = "";
  document.getElementById("btnRunImport").disabled = true;
  document.getElementById("impMsg").textContent = "";
}

function renderImportPreview(res) {
  const s = res.summary;
  document.getElementById("impPreview").innerHTML = previewHtml(res);
  document.getElementById("btnRunImport").disabled = (s.new === 0);
  document.getElementById("impMsg").textContent =
    s.new === 0 ? "没有新东西要导入（内容都在库里了）" : "确认后点右边按钮";
}

async function doScan() {
  const path = document.getElementById("impPath").value.trim();
  if (!path) { toast("先填文件夹路径", true); return; }
  const btn = document.getElementById("btnScan");
  btn.disabled = true; btn.textContent = "扫描中…";
  document.getElementById("impMsg").textContent = "";
  try {
    const res = await post("/api/import/scan", {
      path: path,
      recursive: document.getElementById("impRec").checked
    });
    renderImportPreview(res);
  } catch (e) {
    document.getElementById("impPreview").innerHTML = "";
    document.getElementById("impMsg").textContent = e.message;
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = "扫描预览";
  }
}

async function doImport() {
  const path = document.getElementById("impPath").value.trim();
  const btn = document.getElementById("btnRunImport");
  btn.disabled = true; btn.textContent = "导入中…";
  try {
    const res = await post("/api/import/run", {
      path: path,
      recursive: document.getElementById("impRec").checked,
      local_only: document.getElementById("impLocal").checked
    });
    const s = res.summary;
    toast("导入完成：新增 " + s.new + " 条，跳过重复 " + s.same + " 条");
    renderImportPreview(res);
    document.getElementById("btnRunImport").disabled = true;
    document.getElementById("impMsg").textContent = "导入完成。关掉这个窗口看列表。";
    loadStats(); loadTags(); loadList();
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.textContent = "确认导入";
  }
}

/* ---------------- 粘贴文本 ---------------- */

async function savePaste() {
  const content = document.getElementById("pText").value;
  if (!content.trim()) { toast("正文是空的", true); return; }
  const tags = document.getElementById("pTags").value
    .split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  try {
    const r = await post("/api/materials", {
      title: document.getElementById("pTitle").value,
      content: content,
      tags: tags
    });
    toast(r.message || "已存入");
    closeMask("mkPaste");
    document.getElementById("pTitle").value = "";
    document.getElementById("pText").value = "";
    document.getElementById("pTags").value = "";
    loadStats(); loadTags(); loadList();
  } catch (e) { toast(e.message, true); }
}

/* ---------------- 事件绑定 ---------------- */

let searchTimer = null;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { S.keyword = e.target.value.trim(); loadList(); }, 280);
});

document.getElementById("btnUpload").onclick = () => {
  document.getElementById("upPreview").innerHTML = "";
  document.getElementById("upMsg").textContent = "";
  openMask("mkUpload");
};
document.getElementById("btnPickFiles").onclick = () =>
  document.getElementById("fileInput").click();
document.getElementById("upClear").onclick = () => {
  document.getElementById("upPreview").innerHTML = "";
  document.getElementById("upMsg").textContent = "";
};
document.getElementById("fileInput").onchange = e => {
  uploadFiles(e.target.files);
  e.target.value = "";
};

document.getElementById("btnImport").onclick = () => {
  resetImportPreview();
  document.getElementById("impPath").value = "C:\\Users\\Administrator\\Desktop\\分类";
  openMask("mkImport");
};
document.getElementById("btnScan").onclick = doScan;
document.getElementById("btnRunImport").onclick = doImport;

document.getElementById("btnPaste").onclick = () => openMask("mkPaste");
document.getElementById("btnSavePaste").onclick = savePaste;

document.getElementById("dClose").onclick = closeDrawer;
document.getElementById("mkDrawer").onclick = closeDrawer;
document.getElementById("dSave").onclick = saveDrawer;
document.getElementById("dDelete").onclick = () => {
  if (!S.current) return;
  const id = S.current.id, name = S.current.title;
  if (!confirm('确定删除「' + name + '」？\n\n这个动作不可撤销。')) return;
  api("/api/materials/" + id, { method: "DELETE" })
    .then(() => { toast("已删除"); closeDrawer();
                  loadStats(); loadTags(); loadList(); })
    .catch(e => toast(e.message, true));
};

/* ---- 登录卡片 ---- */
document.querySelectorAll("#authTabs button").forEach(b => {
  b.onclick = () => { aMsg(""); setAuthMode(b.dataset.mode); };
});
document.getElementById("aSubmit").onclick = submitAuth;
["aName", "aPwd"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key === "Enter") submitAuth();
  });
});
document.getElementById("btnLogout").onclick = doLogout;

/* ---- 其他弹窗 ---- */
document.querySelectorAll("[data-close]").forEach(el => {
  el.onclick = () => closeMask(el.closest(".mask").id);
});
document.querySelectorAll(".mask").forEach(mk => {
  if (mk.id === "mkDrawer" || mk.id === "mkAuth") return;   // 这两个不许点空白关掉
  mk.addEventListener("click", e => { if (e.target === mk) closeMask(mk.id); });
});

/* ---- 拖放上传 ---- */
const dropZone = document.getElementById("dropZone");
dropZone.onclick = () => document.getElementById("fileInput").click();

["dragenter", "dragover"].forEach(ev =>
  dropZone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.add("over");
  }));
["dragleave", "drop"].forEach(ev =>
  dropZone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove("over");
  }));
dropZone.addEventListener("drop", e => {
  const fs = e.dataTransfer && e.dataTransfer.files;
  if (fs && fs.length) uploadFiles(fs);
});

/* 拖到页面其它地方也算上传（省得用户必须瞄准那个小框） */
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  if (document.getElementById("mkAuth").classList.contains("on")) return;
  const fs = e.dataTransfer && e.dataTransfer.files;
  if (fs && fs.length) uploadFiles(fs);
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeDrawer();
    document.querySelectorAll(".mask.on").forEach(m => {
      if (m.id === "mkAuth") return;             // 登录框不能被 ESC 关掉
      m.classList.remove("on");
    });
  }
});

/* ---------------- 启动 ---------------- */

function startApp() {
  loadStats();
  loadTags();
  loadList();
}

boot();
</script>
